name: Gitea Actions Demo
run-name: ${{ gitea.actor }} is testing out Gitea Actions 🚀
on: [push]

jobs:
  Explore-Gitea-Actions:
    runs-on: runner1
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ gitea.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by Gitea!"
      - run: echo "🔎 The name of your branch is ${{ gitea.ref }} and your repository is ${{ gitea.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ gitea.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."

      - name: Cache Python virtual environment
        uses: actions/cache@v2
        with:
          path: Myscelium/venv
          key: ${{ runner.os }}-venv-${{ hashFiles('**/Myscelium/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Install CMake (Nightly)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common lsb-release
          echo "deb https://apt.kitware.com/ubuntu/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/kitware.list >/dev/null
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 6AF7F09730B3F0A4
          sudo apt-get update
          sudo apt-get install cmake

      - name: Setup Python environment
        run: |
          cd Myscelium 
          python -m venv venv
          source ./venv/bin/activate
          pip install -U pip
          python -m pip install --upgrade pip
          python -m pip install --upgrade pip setuptools wheel
          
      - name: Install Pyarrow
        run: |
          cd Myscelium 
          python -m venv venv
          source ./venv/bin/activate
          pip install pyarrow

      - name: Install Myscelium Building Depencies
        run: |
          cd Myscelium 
          python -m venv venv
          source ./venv/bin/activate
          pip install -r requirements.txt

      - name: List files in the repository
        run: |
          ls ${{ gitea.workspace }}

      - name: List files in the repository
        run: |
          cd Myscelium
          ls

      - name: Test Communication
        run: |
          cd Myscelium
          source ./venv/bin/activate
          cd tests
          python3 -m pytest -v -s .\test_myscelium.py::test_communication
          
      - run: echo "🍏 This job's status is ${{ job.status }}."
